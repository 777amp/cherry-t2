name: Codebase Map

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**/*'

permissions:
  contents: read

concurrency:
  group: codebase-map-${{ github.ref }}
  cancel-in-progress: true

jobs:
  map:
    name: Generate codebase map
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Generate Graphify map
        uses: ./actions/graphify-map
        with:
          scan-path: .
          output-dir: graphify-out
          graphify-version: '0.9.121'
          python-version: '3.12'
          max-workers: '2'

      - name: Upload codebase map
        uses: actions/upload-artifact@v4
        with:
          name: codebase-map-${{ github.sha }}
          path: graphify-out/
          if-no-files-found: error
          retention-days: 14
          
          