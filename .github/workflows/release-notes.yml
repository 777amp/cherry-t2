name: Release Notes (Vercel AI Gateway)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate categorized release notes via Vercel AI Gateway
        id: notes
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          HEAD_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${HEAD_TAG}$" | head -n 1 || true)
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG=$(git rev-list --max-parents=0 HEAD)
          fi

          COMMITS=$(git log "${PREV_TAG}..${HEAD_TAG}" --pretty=format:"- %s (%h)" || true)
          DIFF_STAT=$(git diff --stat "${PREV_TAG}..${HEAD_TAG}" || true)
          DIFF_PATCH=$(git diff "${PREV_TAG}..${HEAD_TAG}" -- . ':!*.lock' ':!package-lock.json' ':!pnpm-lock.yaml' ':!yarn.lock' | head -c 45000 || true)

          jq -n \
            --arg prev "$PREV_TAG" \
            --arg head "$HEAD_TAG" \
            --arg commits "$COMMITS" \
            --arg stat "$DIFF_STAT" \
            --arg patch "$DIFF_PATCH" \
            '{
              model: "openai/gpt-6-luna",
              service_tier: "flex",
              messages: [
                {
                  role: "system",
                  content: "You generate clean Markdown release notes from git commits and diffs. Group changes under sections: ## feat, ## perf, ## bug, ## refactor, ## docs. Omit any empty section. Write concise bullet points summarizing user-facing or meaningful changes; skip lockfile/trivial noise."
                },
                {
                  role: "user",
                  content: ("Range: " + $prev + " -> " + $head + "\n\nCommits:\n" + $commits + "\n\nDiff stat:\n" + $stat + "\n\nDiff (truncated):\n" + $patch)
                }
              ]
            }' > payload.json

          RESPONSE=$(curl -sS https://ai-gateway.vercel.sh/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${AI_GATEWAY_API_KEY}" \
            -d @payload.json)

          NOTES=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')
          APPLIED_TIER=$(echo "$RESPONSE" | jq -r '.service_tier // "default"')

          if [ -z "$NOTES" ]; then
            echo "Failed to parse release notes. Raw response:"
            echo "$RESPONSE"
            exit 1
          fi

          echo "Applied service_tier: $APPLIED_TIER"

          {
            echo "release_notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.release_notes }}
